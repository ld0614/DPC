
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: Development DPC

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    environment: development
    env:
      Solution_Name: AOVPNDPC.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Update Version Details
      shell: pwsh
      run: './DPCManagement/Scripts/Set-VersionNumber.ps1'

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore NuGet Packages
      run: nuget restore $env:Solution_Name

    - name: Build Full Solution
      run: msbuild $env:Solution_Name /property:Configuration=${{ matrix.configuration }} /property:Platform=x64 /property:RuntimeIdentifier=win-x64

    - name: Sign DPC Library with Artifact Signing
      uses: azure/artifact-signing-action@v1
      with:
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: dsl
        certificate-profile-name: primary
        files-folder: ${{ github.workspace }}\DPCLibrary\obj\x64\${{ matrix.configuration }}
        files-folder-filter: exe,dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build DPC Service
      run: msbuild DPCService /property:Configuration=${{ matrix.configuration }} /property:Platform=x64 /property:RuntimeIdentifier=win-x64

    - name: Sign DPC Service with Artifact Signing
      uses: azure/artifact-signing-action@v1
      with:
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: dsl
        certificate-profile-name: primary
        files-folder: ${{ github.workspace }}\DPCService\obj\x64\${{ matrix.configuration }}
        files-folder-filter: exe,dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    # Restore the installer with the signed service
    - name: Rebuild Installer with Signed Service
      run: msbuild DPCInstaller /property:Configuration=${{ matrix.configuration }} /property:Platform=x64 /property:RuntimeIdentifier=win-x64

    - name: Sign Installer with Artifact Signing
      uses: azure/artifact-signing-action@v1
      with:
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: dsl
        certificate-profile-name: primary
        files-folder: ${{ github.workspace }}\DPCInstaller\bin\x64\${{ matrix.configuration }}
        files-folder-filter: exe,dll,msi
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Run VSTest
      run:  '& "$(vswhere -property installationPath)\Common7\IDE\Extensions\TestPlatform\vstest.console.exe" "*Tests\bin\x64\*\*Tests.dll" /TestCaseFilter:"TestCategory=Basic" '

    - name: Upload Installer
      uses: actions/upload-artifact@v7
      with:
        name: DPC Installer
        path: DPCInstaller\bin\x64\${{ matrix.configuration }}\DPC.msi
        archive: false